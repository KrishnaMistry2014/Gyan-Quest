<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // AI Studio preview environment: HMR is disabled, intercept and silence WebSocket connection attempts
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && reason.message) ? reason.message : String(reason || '');
          var stack = (reason && reason.stack) ? reason.stack : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('closed without opened') ||
            stack.includes('@vite/client') ||
            stack.includes('client.mjs')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var filename = event.filename || '';
          if (
            msg.includes('WebSocket') ||
            filename.includes('@vite/client') ||
            filename.includes('client.mjs')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;
        window.WebSocket = function(url, protocols) {
          if (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client') || url.startsWith('ws:') || url.startsWith('wss:'))) {
            var listeners = {};
            var fakeWs = {
              readyState: 1, // OPEN
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function() { try { fn({ type: 'open' }); } catch (_) {} }, 0);
                }
              },
              removeEventListener: function(type, fn) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                }
              },
              send: function() {},
              close: function() { fakeWs.readyState = 3; }
            };
            return fakeWs;
          }
          return new OriginalWebSocket(url, protocols);
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSED = 3;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CONNECTING = 0;
      })();
    </script>
